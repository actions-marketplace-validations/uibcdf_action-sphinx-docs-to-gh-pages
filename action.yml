name: 'Sphinx docs to GitHub Pages'
description: 'Automatic Sphinx html docs compilation and deployment through the gh-pages branch.'
author: "Diego Prada-Gracia"
branding:
  icon: "upload-cloud"
  color: "orange"
inputs:
  branch:
    description: >-
      Name of the branch where the sphinx documentation is located. Set it to an
      empty string to build whatever reference the workflow already checked out,
      which is what a tag-triggered release usually wants.
    required: false
    default: 'main'
  branch-checkout-args:
    description: >-
      Arguments to pass to `git checkout`: `git checkout ${checkout-args} "${branch}"`
    required: false
    default: ''
  dir_docs:
    description: Path where the sphinx documentation is located
    required: false
    default: 'docs'
  sphinx-apidoc:
    description: >-
      Run `sphinx-apidoc` before compiling, generating one `.rst` file per package
      and subpackage into `dir_docs`. Disabled by default: a project that writes its
      own API reference gets a second, parallel one it never asked for.
    required: false
    default: false
  sphinx-apidoc-exclude:
    description: Files/directories to exclude from sphinx-apidoc
    required: false
    default: '*setup* tests*'
  sphinx-apidoc-opts:
    description: Options for sphinx-apidoc (default outputs to dir_docs and searches for modules one level up)
    required: false
    default: '-o . ../'
  sphinx-opts:
    description: Compilation options for sphinx-build
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: setting the committer name and email
      id: committer
      shell: bash
      run: |
        set -euo pipefail
        author_name="$(git show --format=%an -s)"
        author_email="$(git show --format=%ae -s)"
        echo "::group::Set committer"
        echo "#git config user.name '$author_name'"
        git config user.name "$author_name"
        echo "#git config user.email '$author_email'"
        git config user.email "$author_email"
        echo "::endgroup::"
    - name: gh-pages branch creation if needed
      id: gh-pages-branch-creation
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Checking if gh-pages branch exists"
        if [[ -z "$(git ls-remote --heads origin gh-pages)" ]]; then
           echo "Creating gh-pages branch"
           git checkout --orphan gh-pages
           git reset --hard
           git commit --allow-empty -m "First commit to create gh-pages branch"
           git push origin gh-pages
           echo "Created gh-pages branch"
        else
           echo "Branch gh-pages already exists"
        fi
        echo "::endgroup::"
    - name: Moving to branch where sphinx docs are located
      id: to-branch-with-docs
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        CHECKOUT_ARGS: ${{ inputs.branch-checkout-args }}
      run: |
        set -euo pipefail
        if [ -z "$BRANCH" ]; then
          echo "No branch requested: building the reference already checked out."
          git rev-parse --short HEAD
          exit 0
        fi
        # $CHECKOUT_ARGS is intentionally unquoted so that several arguments split
        # into several words. It is read from the environment, not interpolated
        # into this script, so its content cannot become shell syntax.
        git checkout $CHECKOUT_ARGS "$BRANCH"
    - name: sphinx apidoc generation
      shell: bash -l {0}
      working-directory: ./${{ inputs.dir_docs }}
      env:
        WITH_APIDOC: ${{ inputs.sphinx-apidoc }}
        APIDOC_OPTS: ${{ inputs.sphinx-apidoc-opts }}
        APIDOC_EXCLUDE: ${{ inputs.sphinx-apidoc-exclude }}
      run: |
        set -euo pipefail
        echo ::group::Sphinx apidocs generation
        if [ "$WITH_APIDOC" = "true" ]; then
          # Unquoted on purpose: both carry several arguments. See the note above.
          sphinx-apidoc $APIDOC_OPTS $APIDOC_EXCLUDE
        else
          echo "::notice::sphinx-apidoc did not run. Since v3.0.0 it is disabled by default; set 'sphinx-apidoc: true' if your API reference is generated by it."
        fi
        echo ::endgroup::
    - name: sphinx html docs compilation
      shell: bash -l {0}      # This is needed to work with conda here. See:https://github.com/marketplace/actions/setup-miniconda#IMPORTANT
      working-directory: ./${{ inputs.dir_docs }}
      env:
        SPHINX_OPTS: ${{ inputs.sphinx-opts }}
      run: |
        set -euo pipefail
        echo ::group::Sphinx docs compilation
        # Unquoted on purpose: it carries several arguments. See the note above.
        sphinx-build -M html . _build $SPHINX_OPTS
        echo ::endgroup::
    - name: pushing to gh-pages
      shell: bash
      env:
        DIR_DOCS: ${{ inputs.dir_docs }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        echo ::group::Create README for gh-pages
        SHA=$GITHUB_SHA
        echo "$SHA $GITHUB_EVENT_NAME"
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          SHA=$(jq -r .pull_request.head.sha < "$GITHUB_EVENT_PATH")
        fi
        SHORT_SHA="$(git rev-parse --short "$SHA")"
        if [ "$DIR_DOCS" == "." ]; then
          DIR_HTML="_build/html/"
        else
          DIR_HTML="$DIR_DOCS/_build/html/"
        fi
        if [ ! -d "$DIR_HTML" ]; then
          echo "::error::Sphinx produced no '$DIR_HTML' directory. Nothing was published."
          exit 1
        fi
        echo "#GitHub Pages" > "$DIR_HTML/README.md"
        echo "" >> "$DIR_HTML/README.md"
        echo "Last update of sphinx html documentation from [$SHORT_SHA](https://github.com/$GITHUB_REPOSITORY/tree/$SHA)" >> "$DIR_HTML/README.md"
        cat "$DIR_HTML/README.md"
        echo ::endgroup::
        echo ::group::Create .nojekyll in case 'sphinx.ext.githubpages' is not used
        touch "$DIR_HTML"/.nojekyll
        echo ::endgroup::
        echo ::group::Push to gh-pages
        git add -f "$DIR_HTML"
        git commit -m "From $GITHUB_REF $SHA"
        SUBTREE_REF="$(git subtree split --prefix "$DIR_HTML" "${BRANCH:-HEAD}")"
        git push origin "$SUBTREE_REF":gh-pages --force
        echo ::endgroup::
